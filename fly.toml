app = "lando-pebble-rsvp"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  PEBBLE_RSVP_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "pebble_rsvp_data"
  destination = "/data"
  initial_size = "1GB"
  scheduled_snapshots = true
  snapshot_retention = 7

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
